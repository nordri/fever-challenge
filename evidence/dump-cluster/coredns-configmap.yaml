apiVersion: v1
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready

        rewrite name exact server.fever.svc.cluster.local ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name exact server.example.com ingress-nginx-controller.ingress-nginx.svc.cluster.local
        rewrite name exact server.local ingress-nginx-controller.ingress-nginx.svc.cluster.local

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }

        prometheus :9153

        forward . /etc/resolv.conf {
            max_concurrent 1000
        }

        cache 30 {
            disable success cluster.local
            disable denial cluster.local
        }

        loop
        reload
        loadbalance
    }
