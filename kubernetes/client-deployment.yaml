apiVersion: apps/v1
kind: Deployment
metadata:
  name: fever-client
  namespace: fever
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fever-client
  template:
    metadata:
      labels:
        app: fever-client
    spec:
      containers:
        - name: fever-client
          image: fever-client:0.1.0
          imagePullPolicy: Never
          volumeMounts:
            - name: server-certificate
              mountPath: /app/certs
              readOnly: true
          env:
            - name: SERVER_PORT
              value: "443"
            - name: PYTHONUNBUFFERED
              value: "1"
      volumes:
        - name: server-certificate
          secret:
            secretName: server-tls
            items:
              - key: tls.crt
                path: server.crt
