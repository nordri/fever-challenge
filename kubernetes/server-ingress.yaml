apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fever-server
  namespace: fever
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - server
        - server.example.com
        - server.local
      secretName: server-tls

  rules:
    - host: server
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fever-server
                port:
                  number: 5000

    - host: server.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fever-server
                port:
                  number: 5000

    - host: server.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fever-server
                port:
                  number: 5000
